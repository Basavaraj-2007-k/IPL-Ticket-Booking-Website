
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>IPL 2026 Ticket Booking</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>

        <section id="booking">
            <h2>Ticket Booking Form</h2>

            <form action="#" method="get"
      onsubmit="alert('Booking submitted successfully!'); return false;">

                <label for="name">Full Name:</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required
                       minlength="3"
                       maxlength="30">

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter 10 digit phone number"
                       pattern="[0-9]{10}"
                       required>

                <br><br>

                <label for="match">Choose Match:</label>
                <select id="match" name="match" required>
                    <option value="">-- Select Match --</option>
                    <option value="RCB vs CSK">RCB vs CSK</option>
                    <option value="MI vs KKR">MI vs KKR</option>
                    <option value="SRH vs RR">SRH vs RR</option>
                </select>

                <br><br>

                <label for="stand">Stand Category:</label>
                <select id="stand" name="stand" required>
                    <option value="">-- Select Stand --</option>
                    <option value="General">General</option>
                    <option value="Premium">Premium</option>
                    <option value="VIP">VIP</option>
                </select>

                <br><br>

                <label for="tickets">Number of Tickets:</label>
                <input type="number"
                       id="tickets"
                       name="tickets"
                       min="1"
                       max="10"
                       required
                       placeholder="Enter ticket quantity">

                <br><br>

                <p><strong>Booking Preference:</strong></p>

                <input type="radio"
                       id="family"
                       name="preference"
                       value="Family Seating">

                <label for="family">Family Seating</label>

                <input type="radio"
                       id="regular"
                       name="preference"
                       value="Regular Seating">

                <label for="regular">Regular Seating</label>

                <br><br>

                <button type="submit">Confirm Booking</button>
                <button type="reset">Reset</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
